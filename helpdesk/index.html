<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Service Desk · Free</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: a real help desk shift, calm and practical
   IDEA: sitting at the domain controller: ticket on one side, the server's own tools on the other
   PICTURE: the working desk: queue, ticket, and a DC01 window with ADUC and PowerShell
   COLOUR and TYPE: Franck's portfolio navy + sky blue; Windows-grey ADUC; PowerShell blue; Space Grotesk + Inter
   LAYOUT: queue left, ticket + server right; stacks on phones */
:root{--bg:#0B1626;--panel:#10203A;--line:#22354F;--ink:#FFFFFF;--soft:#C9D4E3;--mute:#9FB0C6;--acc:#7DD3FC;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit}
button{cursor:pointer;min-height:40px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0 12px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
a{color:var(--acc)}
h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;line-height:1.2}h2{font-size:20px}h3{font-size:16px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hw{max-width:1320px;margin:0 auto;padding:10px max(2vw,12px);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font:700 19px 'Space Grotesk',sans-serif}.brand small{display:block;font:500 12px Inter;color:var(--mute)}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);padding:6px 10px;font-size:14px}.chip b{color:var(--acc)}
.seg{display:flex}.seg button{min-width:44px;padding:0 10px}.seg .on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
main{max-width:1320px;margin:0 auto;padding:16px max(2vw,12px) 40px;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px}
.small{font-size:13px;color:var(--mute)}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.qi{text-align:left;padding:9px 11px;display:flex;flex-direction:column;gap:3px;background:var(--bg)}
.qi.sel{border-color:var(--acc)}.qi.done .qt{text-decoration:line-through;color:var(--mute)}
.qtop{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--mute)}
.qt{font-weight:600;font-size:14px}
.tag{font-size:12px;padding:2px 7px;border:1px solid var(--line);white-space:nowrap}
.t-high{color:#FCA5A5;border-color:#7F1D1D}.t-med{color:#FCD34D;border-color:#78350F}.t-low{color:var(--soft)}.t-ok{color:#86EFAC;border-color:#14532D}.t-ps{color:#93C5FD;border-color:#1E3A8A}
.tk{display:flex;flex-direction:column;gap:10px}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.body{background:var(--bg);border:1px solid var(--line);padding:12px;color:var(--soft);white-space:pre-line}
details{border:1px dashed var(--line);padding:8px 12px}summary{cursor:pointer;color:var(--acc);font-weight:600}
details ol{margin:8px 0 0;padding-left:20px;color:var(--soft);font-size:14px}
label{font-size:14px;font-weight:600}
textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:10px;min-height:84px;resize:vertical}
select{min-height:40px;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{padding:11px 13px;border:1px solid}.good{background:#052E1A;border-color:#14532D;color:#DCFCE7}.badf{background:#2A0B0B;border-color:#7F1D1D;color:#FEE2E2}
/* server window */
.srv{margin-top:16px;border:1px solid #3B4A5E;background:#1E2733}
.tb{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#0F1720;padding:6px 10px;font-size:13px;color:var(--soft)}
.apps{display:flex;gap:4px;padding:6px 6px 0;background:#1E2733;flex-wrap:wrap}
.apps button{min-height:36px;font-size:13px;background:#2B3644;border-color:#3B4A5E}.apps .on{background:#F3F3F3;color:#111;border-color:#F3F3F3}
.aduc{background:#F3F3F3;color:#111;font:14px 'Segoe UI',Inter,sans-serif}
.aduc .bar{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border-bottom:1px solid #D0D0D0;background:#FAFAFA}
.aduc .bar button{background:#fff;color:#111;border:1px solid #C8C8C8;min-height:34px;font-size:13px}
.aduc .bar button:disabled{color:#999;cursor:default}
.split{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);min-height:300px}
.tree{border-right:1px solid #D0D0D0;padding:8px;background:#fff}
.tree button{display:block;width:100%;text-align:left;background:none;border:0;color:#111;min-height:30px;padding:0 6px;font-size:13px}
.tree .on{background:#CCE4F7}
.list{background:#fff;overflow-x:auto}
.list table{width:100%;border-collapse:collapse;font-size:13px}
.list th{text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid #D0D0D0;background:#F7F7F7}
.list td{padding:6px 8px;border-bottom:1px solid #EEE;cursor:pointer;white-space:nowrap}
.list tr.on td{background:#CCE4F7}.list .dis{color:#888}
.ico{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px;border-radius:50%;background:#5B8DD6;position:relative}
.ico.d::after{content:'';position:absolute;right:-3px;bottom:-3px;width:8px;height:8px;background:#C42B1C;border-radius:50%;border:1px solid #fff}
.ctx{position:fixed;z-index:40;background:#fff;color:#111;border:1px solid #BBB;box-shadow:0 4px 14px rgba(0,0,0,.35);min-width:200px;padding:4px 0}
.ctx button{display:block;width:100%;text-align:left;background:none;border:0;color:#111;min-height:32px;font-size:13px;padding:0 14px}
.ctx button:hover{background:#E5F1FB}
.dlgwrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:12px}
.dlg{background:#F3F3F3;color:#111;width:min(460px,100%);border:1px solid #888;font:14px 'Segoe UI',Inter,sans-serif}
.dlg .dt{background:#fff;padding:8px 12px;border-bottom:1px solid #DDD;display:flex;justify-content:space-between;align-items:center}
.dlg .dt button{background:none;border:0;color:#111;min-height:30px}
.dlg .tabs{display:flex;gap:2px;padding:8px 12px 0}.dlg .tabs button{background:#E6E6E6;color:#111;border:1px solid #CCC;border-bottom:0;min-height:32px;font-size:13px}.dlg .tabs .on{background:#fff}
.dlg .db{background:#fff;margin:0 12px;border:1px solid #CCC;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.dlg .df{display:flex;justify-content:flex-end;gap:6px;padding:10px 12px}
.dlg .df button,.dlg .db button{background:#fff;color:#111;border:1px solid #AAA;min-height:32px;font-size:13px}
.dlg input[type=password],.dlg select{background:#fff;color:#111;border:1px solid #AAA;min-height:32px;padding:0 6px;width:100%}
.dlg label{font-weight:400;display:flex;gap:8px;align-items:center}
.dlg .mlist{border:1px solid #CCC;min-height:80px;padding:4px}.dlg .mlist div{padding:3px 6px;cursor:pointer}.dlg .mlist .on{background:#CCE4F7}
.ps{background:#012456;color:#EEEDF0;font:14px/1.45 'JetBrains Mono',Consolas,monospace;padding:10px;min-height:300px;max-height:420px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.ps .err{color:#FF8A8A}.ps .cmd{color:#FDFD96}
.psin{display:flex;align-items:center;gap:6px;background:#012456;padding:0 10px 10px;font:14px 'JetBrains Mono',monospace;color:#EEEDF0}
.psin input{flex:1;background:#00183C;color:#fff;border:1px solid #2A4B7C;min-height:38px;padding:0 8px;font:14px 'JetBrains Mono',monospace}
.cheat{display:flex;gap:6px;flex-wrap:wrap;background:#012456;padding:0 10px 10px}
.cheat button{background:#0B3A75;border-color:#2A4B7C;color:#DDE9FF;min-height:32px;font:12px 'JetBrains Mono',monospace}
footer{border-top:1px solid var(--line);color:var(--mute);font-size:13px}
footer div{max-width:1320px;margin:0 auto;padding:14px max(2vw,12px);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr)}.split{grid-template-columns:minmax(0,1fr)}.tree{display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid #D0D0D0}.tree button{width:auto}}
</style>
</head>
<body>
<header><div class="hw">
  <div class="brand">Lab Service Desk <span style="color:var(--acc)">· Free</span><small id="tagline"></small></div>
  <div class="top">
    <div class="seg" role="group" id="paths"></div>
    <span class="chip" id="rank"></span><span class="chip" id="pts"></span>
    <div class="seg" role="group" aria-label="Language / Langue"><button id="en">EN</button><button id="fr">FR</button></div>
  </div>
</div></header>
<main>
  <section class="card" aria-labelledby="qh">
    <h2 id="qh"></h2><div class="small" id="qsub"></div>
    <div class="qlist" id="queue"></div>
    <div class="row" style="margin-top:12px"><button id="reset"></button></div>
  </section>
  <section>
    <div class="card tk" id="ticket"></div>
    <div class="srv">
      <div class="tb"><span>DC01 · lab.local · Windows Server 2022</span><span id="srvnote"></span></div>
      <div class="apps"><button id="appAduc"></button><button id="appPs">Windows PowerShell</button></div>
      <div id="app"></div>
    </div>
  </section>
</main>
<div id="layer"></div>
<footer><div><span id="foot"></span><span><a id="report" href="https://docs.google.com/forms/d/e/1FAIpQLSe4jqyXX0SNE2uCGGqsx2FW9IFh3Gu3ZBDV6NR3caOGc8TF6A/viewform" target="_blank" rel="noopener"></a> · <a id="home" href="https://franck-mabika.github.io/"></a></span></div></footer>

function out(text,cls){st.ps.push({t:text,c:cls||''});if(st.ps.length>200)st.ps=st.ps.slice(-200)}

function has(a,name){return a.some(x=>x.toLowerCase()==='-'+name.toLowerCase()||x.toLowerCase().startsWith('-'+name.toLowerCase()+':'))}
function ident(a){let v=opt(a,'Identity');if(v===undefined){const p=a.slice(1).filter((x,i,arr)=>!x.startsWith('-')&&!(arr[i-1]||'').startsWith('-'));v=p[0]}return v}
function findUser(id){if(!id)return null;id=String(id);const k=id.toLowerCase();if(st.ad[k])return k;const m=Object.keys(st.ad).find(u=>dn(u).toLowerCase()===k||st.ad[u].n.toLowerCase()===k);return m||null}
const notFound=id=>{throw new Error(`Cannot find an object with identity: '${id}' under: 'DC=lab,DC=local'.`)};
const grpOk=g=>{const m=GROUPS.find(x=>x.toLowerCase()===String(g).toLowerCase());if(!m)throw new Error(`Cannot find an object with identity: '${g}' under: 'DC=lab,DC=local'.`);return m};
function userBlock(u,props){const x=st.ad[u];let s=`DistinguishedName : ${dn(u)}\nEnabled           : ${x.en?'True':'False'}\nName              : ${x.n}\nSamAccountName    : ${u}`;
 if(props){s+=`\nLockedOut         : ${x.lock?'True':'False'}\nPasswordExpired   : ${x.mc?'True':'False'}\nPasswordLastSet   : ${x.pw?new Date().toLocaleString('en-US'):'10/30/2026 8:12:03 PM'}\nMemberOf          : {${x.g.map(g=>`CN=${g},OU=Groups,DC=lab,DC=local`).join(', ')}}`}return s+'\n'}
function table(us){return 'Name                 SamAccountName  Enabled  LockedOut\n----                 --------------  -------  ---------\n'+us.map(u=>{const x=st.ad[u];return x.n.padEnd(21)+u.padEnd(16)+(x.en?'True':'False').padEnd(9)+(x.lock?'True':'False')}).join('\n')+'\n'}
function runOne(line,piped){
 const a=args(line);if(!a.length)return null;const c=a[0].toLowerCase();
 switch(c){
 case 'cls':case 'clear':case 'clear-host':st.ps=[];return null;
 case 'help':case 'get-help':out('Commands you can use in this lab:\n  Get-ADUser <user> [-Properties *]   Get-ADUser -Filter *\n  Search-ADAccount -LockedOut | -AccountDisabled\n  Unlock-ADAccount / Enable-ADAccount / Disable-ADAccount -Identity <user>\n  Set-ADAccountPassword -Identity <user> -Reset -NewPassword (Read-Host -AsSecureString "Temp password")\n  Set-ADUser -Identity <user> -ChangePasswordAtLogon $true\n  Get-ADGroupMember "<group>"   Get-ADPrincipalGroupMembership <user>\n  Add-ADGroupMember / Remove-ADGroupMember -Identity "<group>" -Members <user>\n  Move-ADObject -Identity "<DistinguishedName>" -TargetPath "OU=<ou>,DC=lab,DC=local"\n  Tip: use | to pipe, e.g. Search-ADAccount -LockedOut | Unlock-ADAccount\n');return null;
 case 'get-aduser':{if(has(a,'Filter')){const us=Object.keys(st.ad);if(piped)return us;out(table(us));return us}
  const id=ident(a),u=findUser(id);if(!u)notFound(id);if(piped)return [u];out(userBlock(u,has(a,'Properties')));return [u]}
 case 'search-adaccount':{let us=[];if(has(a,'LockedOut'))us=Object.keys(st.ad).filter(u=>st.ad[u].lock);else if(has(a,'AccountDisabled'))us=Object.keys(st.ad).filter(u=>!st.ad[u].en);else throw new Error('Parameter set cannot be resolved. Use -LockedOut or -AccountDisabled.');
  if(!piped)out(us.length?table(us):'');return us}
 case 'unlock-adaccount':case 'enable-adaccount':case 'disable-adaccount':{
  const list=piped||[(()=>{const id=ident(a),u=findUser(id);if(!u)notFound(id);return u})()];
  const f={'unlock-adaccount':'unlock','enable-adaccount':'enable','disable-adaccount':'disable'}[c];
  list.forEach(u=>A[f](u,'ps'));if(piped&&f==='unlock'&&list.length>1)st.flags.pipeUnlock=true;return null}
 case 'set-adaccountpassword':{const id=ident(a),u=findUser(id);if(!u)notFound(id);if(!has(a,'Reset'))throw new Error('Use -Reset to set a new password without the old one.');
  if(!/read-host/i.test(line)||!/asSecureString/i.test(line))throw new Error('Cannot bind parameter \'NewPassword\'. Use -NewPassword (Read-Host -AsSecureString "Temp password").');
  out('Temp password: ************');A.reset(u,'ps');return null}
 case 'set-aduser':{const id=ident(a),u=findUser(id);if(!u)notFound(id);const v=opt(a,'ChangePasswordAtLogon');if(v===undefined)throw new Error('This lab supports: Set-ADUser <user> -ChangePasswordAtLogon $true');
  A.mc(u,'ps',String(v).toLowerCase()==='$true');return null}
 case 'get-adgroupmember':{const g=grpOk(ident(a));const us=Object.keys(st.ad).filter(u=>st.ad[u].g.includes(g));if(g==='IT Admins')st.flags.listedAdmins=true;
  out('name                 SamAccountName  objectClass\n----                 --------------  -----------\n'+us.map(u=>st.ad[u].n.padEnd(21)+u.padEnd(16)+'user').join('\n')+'\n');return us}
 case 'get-adprincipalgroupmembership':{const id=ident(a),u=findUser(id);if(!u)notFound(id);out('name\n----\nDomain Users\n'+st.ad[u].g.join('\n')+'\n');return null}
 case 'add-adgroupmember':case 'remove-adgroupmember':{const g=grpOk(opt(a,'Identity')||a[1]);const m=opt(a,'Members');if(!m||m===true)throw new Error('Missing an argument for parameter \'Members\'.');
  const us=String(m).split(',').map(x=>{const u=findUser(x.trim());if(!u)notFound(x.trim());return u});
  if(c==='remove-adgroupmember'&&!/-confirm:\$false/i.test(line))out('Confirm\nAre you sure you want to perform this action? [Y] Yes  (auto-answered Y in this lab)');
  us.forEach(u=>A[c==='add-adgroupmember'?'add':'rm'](u,'ps',g));return null}
 case 'move-adobject':{const id=opt(a,'Identity'),u=findUser(id);if(!u)notFound(id);const tp=String(opt(a,'TargetPath')||'');const mm=tp.match(/^OU=(\w+),DC=lab,DC=local$/i);
  const ou=mm&&OUS.find(o=>o.toLowerCase()===mm[1].toLowerCase());if(!ou)throw new Error(`Directory object not found: '${tp}'`);A.move(u,'ps',ou);return null}
 default:throw new Error(`${a[0]} : The term '${a[0]}' is not recognized as the name of a cmdlet, function, script file, or operable program. Check the spelling of the name, or if a path was included, verify that the path is correct and try again.`);
 }
}
function runPs(line){
 line=line.trim();if(!line)return;out('PS C:\\Users\\Administrator> '+line,'cmd');st.psHist.unshift(line);
 try{const parts=line.split('|').map(s=>s.trim());let piped=null;
  parts.forEach((p,i)=>{const r=runOne(p,i>0?piped:(parts.length>1?false:null));piped=Array.isArray(r)?r:null;if(i===0&&parts.length>1&&!Array.isArray(r))throw new Error('The first command did not return any objects to pipe.')})}

}

 <h2>${esc(x.t)}</h2><div class="row small">${l.from}: ${esc(t.from)} · ${asg?`<span style="color:#86EFAC">${l.assigned}</span>`:`${l.unassigned} <button class="pri" id="asg">${l.assign}</button>`}</div>
 <div class="body">${esc(x.b)}</div>
 <details id="hint" ${st.hint&&st.hint[t.id]?'open':''}><summary>💡 ${l.hintT}</summary>${t.ps?'':`<h3 style="margin-top:8px">${l.gui}</h3><ol>${x.g.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`}<h3 style="margin-top:8px">${l.ps}</h3><ol>${x.p.map(s=>`<li><code>${esc(s)}</code></li>`).join('')}</ol></details>
 <label for="notes">${l.notes}</label><textarea id="notes" placeholder="${esc(l.notesPh)}">${esc(st.notes[t.id]||'')}</textarea>
 <div class="row"><label for="res">${l.res}</label><select id="res"><option value="resolved">${l.resolved}</option><option value="denied">${l.denied}</option></select><button class="pri" id="closeb">${l.close}</button></div>
 ${fbText?`<div class="fb ${st.fb==='good'?'good':'badf'}" role="status">${esc(fbText)}</div>`:''}`;
 if(st.app==='aduc'){
  const us=Object.keys(st.ad).filter(u=>st.ou==='all'||st.ad[u].ou===st.ou),su=st.su&&st.ad[st.su]?st.su:null;
  $('app').innerHTML=`<div class="aduc"><div class="bar"><button data-g="reset" ${su?'':'disabled'}>${l.resetPw}</button><button data-g="${su&&!st.ad[su].en?'enable':'disable'}" ${su?'':'disabled'}>${su&&!st.ad[su].en?l.enable:l.disable}</button><button data-g="group" ${su?'':'disabled'}>${l.addGrp}</button><button data-g="move" ${su?'':'disabled'}>${l.move}</button><button data-g="props" ${su?'':'disabled'}>${l.props}</button></div>
  <div class="split"><div class="tree"><div class="small" style="color:#555;padding:4px 6px">lab.local</div><button data-ou="all" class="${st.ou==='all'?'on':''}">${l.allUsers}</button>${OUS.map(o=>`<button data-ou="${o}" class="${st.ou===o?'on':''}">📁 ${o}</button>`).join('')}</div>
  <div class="list"><table><thead><tr><th>${l.name}</th><th>${l.type}</th><th>OU</th><th>${l.desc}</th></tr></thead><tbody>${us.map(u=>{const v=st.ad[u];return `<tr data-u="${u}" class="${u===su?'on':''}${v.en?'':' dis'}" tabindex="0"><td><span class="ico${v.en?'':' d'}"></span>${esc(v.n)}</td><td>${l.user}</td><td>${v.ou}</td><td>${v.lock?'🔒 ':''}${v.g.join(', ')}</td></tr>`}).join('')}</tbody></table></div></div></div>`;
 } else {
  $('app').innerHTML=`<div class="ps" id="psout">Windows PowerShell\nCopyright (C) Microsoft Corporation. All rights reserved.\nType help to see the commands for this lab.\n\n${st.ps.map(o=>`<span class="${o.c}">${esc(o.t)}</span>`).join('\n')}</div>
  <div class="psin"><label for="psin">PS C:\\&gt;</label><input id="psin" autocomplete="off" spellcheck="false" aria-label="PowerShell command"></div>
  <div class="cheat">${['help','Get-ADUser -Filter *','Search-ADAccount -LockedOut','Get-ADGroupMember "IT Admins"','cls'].map(c=>`<button data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
  const p=$('psout');p.scrollTop=p.scrollHeight;
 }
}
let hi=-1,lastRow={u:'',t:0};
document.addEventListener('click',e=>{
 const m=document.querySelector('.ctx');if(m&&!e.target.closest('.ctx'))m.remove();
 const tr=e.target.closest('tr[data-u]');if(tr){const u=tr.dataset.u,now=Date.now();if(lastRow.u===u&&now-lastRow.t<450){lastRow={u:'',t:0};openDlg('props',u);return}lastRow={u,t:now};st.su=u;draw();return}
 const b=e.target.closest('button');if(!b)return;const l=L();
 if(b.dataset.t){st.sel=b.dataset.t;st.fb=null;save();return draw()}
 if(b.dataset.path!==undefined){st.path=+b.dataset.path;save();return draw()}
 if(b.dataset.ou){st.ou=b.dataset.ou;st.su=null;return draw()}
 if(b.dataset.c){$('psin').value=b.dataset.c;$('psin').focus();return}
 if(b.dataset.tab){dlg.tab=b.dataset.tab;dlg.err='';return drawDlg()}
 if(b.dataset.ctx){const u=b.dataset.u;b.closest('.ctx').remove();return guiAct(b.dataset.ctx,u)}
 if(b.dataset.g){return guiAct(b.dataset.g,st.su)}
 if(b.dataset.d){const d=b.dataset.d;if(d==='x'){dlg=null;return drawDlg()}if(d==='ok')return dlgOk(true);if(d==='apply')return dlgOk(false);
  if(d==='addg'){dlg.adding=true;return drawDlg()}if(d==='addgo'){A.add(dlg.u,'gui',$('gsel2').value);dlg.adding=false;save();draw();return drawDlg()}
  if(d==='rmg'){A.rm(dlg.u,'gui',dlg.sel);dlg.sel=null;save();draw();return drawDlg()}}
 if(b.id==='en'||b.id==='fr'){st.lang=b.id;save();draw();return drawDlg()}
 if(b.id==='appAduc'){st.app='aduc';save();return draw()}
 if(b.id==='appPs'){st.app='ps';save();draw();return $('psin').focus()}
 if(b.id==='asg'){st.asg[st.sel]=true;st.fb=null;save();return draw()}
 if(b.id==='closeb')return closeTicket();
 if(b.id==='reset'){const lang=st.lang;st=fresh();st.lang=lang;save();return draw()}
});
document.addEventListener('click',e=>{const g=e.target.closest('.mlist div[data-g]');if(g&&dlg){dlg.sel=g.dataset.g;drawDlg()}});
function guiAct(k,u){const l=L();if(!u)return toast(l.selectUser);
 if(k==='enable'||k==='disable'){A[k](u,'gui');st.fb=null;save();return draw()}openDlg(k,u)}
document.addEventListener('contextmenu',e=>{const tr=e.target.closest('tr[data-u]');if(!tr)return;e.preventDefault();const u=tr.dataset.u,v=st.ad[u],l=L();st.su=u;draw();
 const m=document.createElement('div');m.className='ctx';m.style.left=Math.min(e.clientX,innerWidth-220)+'px';m.style.top=Math.min(e.clientY,innerHeight-220)+'px';
 m.innerHTML=[['reset',l.resetPw],[v.en?'disable':'enable',v.en?l.disable:l.enable],['group',l.addGrp],['move',l.move],['props',l.props]].map(([k,t])=>`<button data-ctx="${k}" data-u="${u}">${t}</button>`).join('');document.body.appendChild(m)});
document.addEventListener('keydown',e=>{
 if(e.target.id==='psin'){if(e.key==='Enter'){const v=e.target.value;hi=-1;runPs(v)}
  if(e.key==='ArrowUp'&&st.psHist.length){hi=Math.min(hi+1,st.psHist.length-1);e.target.value=st.psHist[hi];e.preventDefault()}
  if(e.key==='ArrowDown'){hi=Math.max(hi-1,-1);e.target.value=hi<0?'':st.psHist[hi];e.preventDefault()}}
 if(e.key==='Escape'&&dlg){dlg=null;drawDlg()}
 if(e.key==='Enter'&&e.target.matches('tr[data-u]')){st.su=e.target.dataset.u;draw()}
});
document.addEventListener('toggle',e=>{if(e.target.id==='hint'){st.hint=st.hint||{};st.hint[st.sel]=e.target.open;save()}},true);
document.addEventListener('input',e=>{if(e.target.id==='notes'){st.notes[st.sel]=e.target.value;save()}});
draw();
}
</script>
